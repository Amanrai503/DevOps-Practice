<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Docker Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
        }

        button {
            padding: 10px 20px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <h1>Hello from AWS EC2!</h1>
        <p>This website runs inside Docker.</p>

        <h2 id="count">0</h2>
        <button onclick="increaseCount()">Click Counter</button>
    </div>

    <script>
        let count = 0;

        function increaseCount() {
            count++;
            document.getElementById("count").innerText = count;
        }
    </script>
</body>
</html>
